name: Client

# Trigger: runs on a push to any branch, but only if the client or this
# workflow file changed. The manual button runs it without needing a push.
on:
  push:
    paths:
      - "client/**"
      - ".github/workflows/client.yml" # Editing this file should re-run it.
  workflow_dispatch:

# The built-in GITHUB_TOKEN is read-only. A job that needs more must ask for it.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest # A fresh, empty VM for every run.

    defaults:
      run:
        # package.json lives in client/, not the repo root.
        working-directory: client

    steps:
      # The VM starts empty. This downloads your repo onto it.
      - uses: actions/checkout@v7

      # Nuxt 4.5 needs Node >= 22.19.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Installs exactly what package-lock.json says.
      - run: npm ci

      # `--run` = run once and exit (plain `vitest` waits in watch mode).
      - run: npm test -- --run
