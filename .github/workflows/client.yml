name: Client

# Trigger: runs on a push to any branch, but only if the client or this
# workflow file changed. The manual button runs it without needing a push.
on:
  push:
    paths:
      - "client/**"
      - ".github/workflows/client.yml" # Editing this file should re-run it.
  workflow_dispatch:

# The built-in GITHUB_TOKEN is read-only. A job that needs more must ask for it.
permissions:
  contents: read

# One run at a time per branch. On feature branches, pushing again cancels the
# older run (saves minutes, avoids stale results). On main a run in progress is
# never cancelled, so each merge keeps its own result.
concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest # A fresh, empty VM for every run.
    timeout-minutes: 10 # Kill runaway jobs instead of burning free minutes.

    defaults:
      run:
        # package.json lives in client/, not the repo root.
        working-directory: client

    steps:
      # The VM starts empty. This downloads your repo onto it.
      - uses: actions/checkout@v7

      # Nuxt 4.5 needs Node >= 22.19.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Installs exactly what package-lock.json says.
      - run: npm ci

      # `--run` = run once and exit (plain `vitest` waits in watch mode).
      - run: npm test -- --run

  # Builds the production Docker image and publishes it to GitHub Container
  # Registry (ghcr.io). Nothing runs anywhere: another system would pull it.
  publish:
    # Wait for `test`; skipped entirely if `test` fails.
    needs: test
    # Only publish from main. Without this, every branch push would publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Job-level permissions REPLACE the workflow-level ones, so contents: read
    # is restated. `packages: write` lets the token push to ghcr.io.
    permissions:
      contents: read
      packages: write

    steps:
      # Each job gets its own fresh VM, so it must check out the code again.
      - uses: actions/checkout@v7

      # Logs in to ghcr.io with the run's own short-lived token.
      # No personal access token and no stored secret needed.
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the image tags and labels from the commit, e.g.
      # ghcr.io/<owner>/<repo>/client:main-a1b2c3d and :latest. It also adds the
      # label that links the package back to this repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/client
          tags: |
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      # Same build as before (target + context), but now it also pushes.
      - uses: docker/build-push-action@v7
        with:
          context: ./client
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
